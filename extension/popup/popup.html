<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Canvas Enhancer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 300px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #111827; background: #fff; }

    .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff; padding: 16px 18px; }
    .header-title { font-size: 15px; font-weight: 700; }
    .header-sub { font-size: 11px; opacity: .75; margin-top: 2px; }

    .body { padding: 16px 18px; }

    .status { border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; border: 1px solid; }
    .status.active { background: #f0fdf4; border-color: #86efac; }
    .status.locked { background: #fafafa; border-color: #e5e7eb; }
    .status-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
    .status-label.active { color: #16a34a; }
    .status-label.locked { color: #6b7280; }
    .status-desc { font-size: 12px; color: #4b5563; line-height: 1.4; }

    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; font-size: 13px; outline: none; }
    input:focus { border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,.15); }

    .btn { display: block; width: 100%; margin-top: 8px; padding: 9px 0; background: #7c3aed; color: #fff; border: none; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn:hover { background: #6d28d9; }
    .btn:disabled { background: #c4b5fd; cursor: default; }
    .btn.secondary { background: none; color: #7c3aed; border: 1px solid #7c3aed; margin-top: 6px; }
    .btn.secondary:hover { background: #f5f3ff; }

    .feedback { margin-top: 7px; font-size: 12px; min-height: 16px; }
    .feedback.error { color: #dc2626; }
    .feedback.success { color: #16a34a; }

    .divider { border: none; border-top: 1px solid #f3f4f6; margin: 14px 0; }

    .upgrade { background: #f5f3ff; border: 1px solid #ede9fe; border-radius: 8px; padding: 12px 14px; text-align: center; }
    .upgrade-price { font-size: 20px; font-weight: 800; color: #7c3aed; }
    .upgrade-desc { font-size: 11px; color: #6b7280; margin-bottom: 10px; margin-top: 2px; }

    .footer { padding: 8px 18px 12px; text-align: center; font-size: 11px; color: #9ca3af; }
    .footer a { color: #7c3aed; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">Canvas Enhancer</div>
    <div class="header-sub">AI-powered tools for Canvas LMS</div>
  </div>

  <div class="body">
    <div id="status" class="status locked">
      <div id="status-label" class="status-label locked">No License</div>
      <div id="status-desc" class="status-desc">Enter your license key below to unlock AI features.</div>
    </div>

    <div id="license-section">
      <label for="key-input">License Key</label>
      <input type="text" id="key-input" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" />
      <button class="btn" id="activate-btn">Activate License</button>
      <div class="feedback" id="feedback"></div>
    </div>

    <div id="upgrade-section" style="display:none;">
      <hr class="divider" />
      <div class="upgrade">
        <div class="upgrade-price">$79<span style="font-size:13px;font-weight:400;color:#6b7280;">/year</span></div>
        <div class="upgrade-desc">50 AI generations/month · All features</div>
        <a href="https://canvasenhancer.com/upgrade" target="_blank" rel="noopener" class="btn" style="display:block;text-align:center;text-decoration:none;">Get Pro →</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="https://canvasenhancer.com" target="_blank" rel="noopener">canvasenhancer.com</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
