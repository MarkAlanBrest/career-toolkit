name: Sync safety-training-platform Vercel repo

on:
  push:
    branches:
      - safety-training-platform-main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to MarkAlanBrest/safety-training-platform
        env:
          SYNC_TOKEN: ${{ secrets.SAFETY_TRAINING_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "SAFETY_TRAINING_SYNC_TOKEN is not set. Add a PAT with push access to safety-training-platform."
            exit 1
          fi

          git clone "https://x-access-token:${SYNC_TOKEN}@github.com/MarkAlanBrest/safety-training-platform.git" target
          cd target
          git fetch "https://x-access-token:${SYNC_TOKEN}@github.com/MarkAlanBrest/career-toolkit.git" safety-training-platform-main
          git merge FETCH_HEAD -m "Sync from career-toolkit safety-training-platform-main"
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/MarkAlanBrest/safety-training-platform.git" main
