<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connecting to Google…</title>
<meta name="robots" content="noindex">
<style>
  html,body{height:100%;margin:0;}
  body{display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:#F8FAFC;color:#1E293B;}
  .box{text-align:center;padding:24px;}
  .spinner{width:28px;height:28px;border:3px solid #E2E8F0;border-top-color:#1a73e8;border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  p{font-size:14px;color:#64748B;margin:0;}
  .err{color:#DC2626;}
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <p id="msg">Finishing sign-in…</p>
  </div>
<script>
(function () {
  // Google's OAuth implicit-grant flow redirects back here with the token in the
  // URL fragment (never the query string, so it's not sent to any server/logs).
  // This page's only job: hand that token to the window that opened the popup
  // (the Tampermonkey userscript running on classroom.google.com) and close.
  var msgEl = document.getElementById('msg');
  var spinnerEl = document.getElementById('spinner');

  function fail(text) {
    spinnerEl.style.display = 'none';
    msgEl.textContent = text;
    msgEl.className = 'err';
  }

  try {
    var hash = window.location.hash.replace(/^#/, '');
    var params = new URLSearchParams(hash);
    var error = params.get('error');
    var accessToken = params.get('access_token');
    var expiresIn = params.get('expires_in');

    if (!window.opener) {
      fail('This page should only be opened by the Topic Builder script. You can close this tab.');
      return;
    }

    if (error) {
      window.opener.postMessage({ type: 'tb-oauth', error: error }, 'https://classroom.google.com');
      msgEl.textContent = 'Google sign-in was cancelled. You can close this tab.';
      spinnerEl.style.display = 'none';
      setTimeout(function () { window.close(); }, 1500);
      return;
    }

    if (!accessToken) {
      fail('No access token returned. You can close this tab and try again.');
      return;
    }

    window.opener.postMessage({
      type: 'tb-oauth',
      token: accessToken,
      expiresAt: Date.now() + (parseInt(expiresIn, 10) || 3600) * 1000
    }, 'https://classroom.google.com');

    msgEl.textContent = 'Connected — you can close this tab.';
    spinnerEl.style.display = 'none';
    setTimeout(function () { window.close(); }, 1200);
  } catch (e) {
    fail('Something went wrong finishing sign-in. You can close this tab and try again.');
  }
})();
</script>
</body>
</html>
